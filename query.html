<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TSMCSD 2026年會 | 報到台編號查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --deep-blue: #1a3a5c;
  --nav-blue: #1A5D99;
  --medium-blue: #2c6fA0;
  --mist-blue: #6a9ec0;
  --light-blue: #a8cfea;
  --pale-blue: #d6e9f5;
  --ice-blue: #eaf3fa;
  --teal-blue: #3a7ca5;
  --warm-gold: #d4a843;
  --light-gold: #f0d68a;
  --pale-gold: #fdf5e0;
  --cream: #faf6ee;
  --coral: #e07855;
  --white: #ffffff;
  --text-dark: #1a2a3a;
  --text-body: #2c3e50;
  --text-muted: #6b7c8d;
  --card-shadow: 0 4px 20px rgba(26,93,153,0.08);
  --card-shadow-hover: 0 8px 32px rgba(26,93,153,0.14);
  --card-radius: 16px;
  --btn-radius: 28px;
  --font-main: 'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-main);
  color: var(--text-body);
  background: var(--ice-blue);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  padding-top: 58px;
}

/* ========== HEADER / NAV（與手冊頁一致） ========== */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(26,93,153,0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 2px 12px rgba(26,93,153,0.2);
}
.header-inner {
  max-width: 680px; margin: 0 auto;
  display: flex; align-items: center; justify-content: flex-start;
  padding: 0.55rem clamp(0.9rem, 3vw, 1.5rem);
}
.header-logo {
  display: flex; align-items: center; gap: 0.6rem;
  color: var(--white); font-weight: 700; font-size: 0.92rem;
  text-decoration: none; min-width: 0;
}
.header-logo .logo-img {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  object-fit: contain; background: rgba(255,255,255,0.95); padding: 2px;
}
.header-logo .logo-text { line-height: 1.2; }
.header-logo .logo-text small {
  display: block; font-size: 0.72rem; font-weight: 400;
  opacity: 0.85; margin-top: 1px;
}

/* ========== SECTION 基底 ========== */
.section {
  max-width: 680px; margin: 0 auto;
  padding: clamp(1.2rem, 3vw, 2rem) clamp(0.9rem, 3vw, 1.5rem) 1rem;
}
.section-head {
  margin-bottom: clamp(1.1rem, 3vw, 1.6rem); padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--pale-blue);
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.5rem 1rem;
}
.section-head .tag {
  display: inline-flex; align-items: center;
  background: var(--nav-blue); color: var(--white);
  padding: 0.32rem 0.85rem; border-radius: 6px;
  font-size: 0.76rem; font-weight: 700; letter-spacing: 0.1em;
  line-height: 1; flex-shrink: 0;
}
.section-head .meta { color: var(--text-muted); font-size: 0.88rem; line-height: 1.55; flex: 1; min-width: 0; }
.section-head .meta strong { color: var(--nav-blue); font-weight: 600; }

/* ========== 查詢卡 ========== */
.query-card {
  background: var(--white); border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  padding: clamp(1.2rem, 3.5vw, 2rem) clamp(1rem, 3.5vw, 1.8rem);
}
.query-card h2 {
  color: var(--deep-blue);
  font-size: clamp(1.15rem, 3.4vw, 1.5rem); font-weight: 800;
  letter-spacing: 0.06em; text-align: center; margin-bottom: 0.35rem;
}
.query-card .lead {
  color: var(--text-muted); font-size: clamp(0.85rem, 2.2vw, 0.95rem);
  text-align: center; margin-bottom: clamp(1rem, 3vw, 1.5rem);
}
.search-row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
#nameInput {
  flex: 1 1 220px; min-width: 0;
  font-family: var(--font-main);
  font-size: clamp(1.15rem, 3.2vw, 1.5rem); font-weight: 500;
  padding: clamp(0.75rem, 2.2vw, 1rem) 1rem;
  border: 2px solid var(--pale-blue); border-radius: 12px;
  background: var(--ice-blue); color: var(--text-dark);
  text-align: center; letter-spacing: 0.18em;
  transition: border-color 0.2s, background 0.2s;
}
#nameInput::placeholder { color: var(--mist-blue); font-weight: 400; letter-spacing: 0.1em; }
#nameInput:focus { outline: none; border-color: var(--nav-blue); background: var(--white); }
.btn-search {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  padding: clamp(0.75rem, 2.2vw, 1rem) clamp(1.4rem, 4vw, 2.2rem);
  min-height: 48px;
  background: linear-gradient(135deg, var(--nav-blue), var(--medium-blue));
  color: var(--white); border: none; border-radius: 99px;
  font-family: var(--font-main); font-size: clamp(1rem, 2.6vw, 1.15rem); font-weight: 700;
  letter-spacing: 0.08em; cursor: pointer;
  box-shadow: 0 4px 16px rgba(26,93,153,0.25);
  transition: transform 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.btn-search:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(26,93,153,0.35); }
.btn-search:active { transform: translateY(0); }
.btn-search:disabled { background: #cbd5e0; box-shadow: none; transform: none; cursor: not-allowed; }
.hint {
  margin-top: 0.95rem; color: var(--text-muted);
  font-size: clamp(0.8rem, 2vw, 0.86rem); line-height: 1.75;
  background: var(--ice-blue); border-left: 3px solid var(--warm-gold);
  padding: 0.6rem 0.9rem; border-radius: 0 8px 8px 0;
}
.hint strong { color: var(--nav-blue); font-weight: 700; }

/* ========== 查詢結果 ========== */
#result { margin-top: clamp(1rem, 3vw, 1.4rem); }
.record {
  background: var(--white); border-radius: var(--card-radius);
  overflow: hidden; box-shadow: var(--card-shadow);
  border: 1px solid var(--pale-blue);
  margin-bottom: 1rem;
  animation: cardFade 0.3s ease;
}
@keyframes cardFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.record-header {
  background: linear-gradient(135deg, var(--nav-blue), var(--medium-blue));
  color: var(--white);
  padding: clamp(0.9rem, 2.5vw, 1.1rem) clamp(1rem, 3vw, 1.3rem);
  display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
  flex-wrap: wrap;
}
.record-header .name-main { font-size: clamp(1.2rem, 4vw, 1.5rem); font-weight: 800; letter-spacing: 0.08em; }
/* 報到台編號：整張卡的主角 */
.desk-block {
  background: linear-gradient(135deg, var(--pale-gold), var(--cream));
  border-bottom: 1px solid var(--pale-blue);
  padding: clamp(1rem, 3.5vw, 1.5rem) 1rem;
  text-align: center;
}
.desk-label {
  color: var(--nav-blue); font-size: clamp(0.75rem, 2vw, 0.85rem);
  font-weight: 700; letter-spacing: 0.22em; margin-bottom: 0.3rem;
}
.desk-value {
  color: var(--deep-blue); font-weight: 900;
  font-size: clamp(2.6rem, 12vw, 4.2rem); line-height: 1.1;
  letter-spacing: 0.06em;
  text-shadow: 0 2px 10px rgba(212,168,67,0.35);
}
.desk-note {
  color: var(--text-body); font-size: clamp(0.82rem, 2.2vw, 0.92rem);
  line-height: 1.65; margin: 0.6rem auto 0; max-width: 22em;
  padding-top: 0.6rem; border-top: 1px dashed rgba(212,168,67,0.55);
}
.desk-note b { color: var(--nav-blue); font-weight: 800; }
.field-row {
  display: flex; gap: 0.9rem;
  padding: clamp(0.65rem, 2vw, 0.85rem) clamp(1rem, 3vw, 1.3rem);
  border-bottom: 1px solid var(--pale-blue);
  font-size: clamp(0.88rem, 2.3vw, 0.98rem);
}
.field-row:last-child { border-bottom: none; }
.field-row:nth-child(even) { background: #fbfdff; }
.field-label {
  flex: 0 0 6em; color: var(--nav-blue);
  font-size: clamp(0.8rem, 2.1vw, 0.87rem); font-weight: 700; letter-spacing: 0.06em;
}
.field-value { flex: 1; color: var(--text-dark); font-weight: 600; word-break: break-word; }

.msg {
  background: var(--white); border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  padding: clamp(1rem, 3vw, 1.4rem);
  font-size: clamp(0.86rem, 2.2vw, 0.94rem); line-height: 1.8; color: var(--text-body);
  border-left: 4px solid var(--warm-gold);
  animation: cardFade 0.3s ease;
}
.msg.msg-error { border-left-color: var(--coral); }
.msg strong {
  display: block; color: var(--deep-blue);
  font-size: clamp(1rem, 2.8vw, 1.12rem); font-weight: 800;
  margin-bottom: 0.35rem; letter-spacing: 0.04em;
}
.loading { text-align: center; color: var(--text-muted); padding: 1.8rem; font-size: 0.95rem; }
.spinner {
  width: 28px; height: 28px; border: 3px solid var(--pale-blue);
  border-top-color: var(--nav-blue); border-radius: 50%;
  margin: 0 auto 0.7rem; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.reset-bar { text-align: center; margin-top: 0.5rem; }
.btn-reset {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.65rem 1.7rem; min-height: 44px;
  background: var(--white); color: var(--nav-blue);
  border: 2px solid var(--pale-blue); border-radius: 99px;
  font-family: var(--font-main); font-size: 0.92rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.btn-reset:hover { border-color: var(--nav-blue); background: var(--ice-blue); transform: translateY(-1px); }

/* ========== FOOTER ========== */
.site-footer {
  background: #1A5D99; color: rgba(255,255,255,0.7);
  text-align: center; padding: 1.5rem 1.2rem;
  font-size: 0.82rem; line-height: 1.7; margin-top: clamp(2rem, 6vw, 3rem);
}
.site-footer .footer-main { color: var(--white); font-weight: 500; margin-bottom: 0.3rem; }

/* ========== 平板 ========== */
@media (max-width: 860px) {
  .header-logo .logo-text small { display: none; }
}
/* ========== 手機 ========== */
@media (max-width: 540px) {
  .header-inner { padding: 0.5rem 1rem; }
  .header-logo { font-size: 0.82rem; }
  .section-head .meta { font-size: 0.8rem; flex-basis: 100%; }
  .search-row { flex-direction: column; }
  /* column 排列時 flex-basis 會作用在「高度」上，必須歸零避免輸入框被撐高 */
  #nameInput { flex: 0 0 auto; width: 100%; }
  .btn-search { width: 100%; }
  .field-label { flex-basis: 5.4em; }
}
/* ========== 手機橫向／矮螢幕 ========== */
@media (max-height: 480px) and (orientation: landscape) {
  body { padding-top: 52px; }
  .desk-block { padding: 0.8rem 1rem; }
  .desk-value { font-size: 2.4rem; }
}
</style>
</head>
<body id="top">

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <a href="handbook.html#top" class="header-logo">
      <img src="https://raw.githubusercontent.com/ling3567/2026annualconference/main/images/TSMCSD-logo.png" alt="TSMCSD" class="logo-img">
      <span class="logo-text">
        台灣醫事聯合臨床技能發展學會
        <small>2026 年會報到台編號查詢</small>
      </span>
    </a>
  </div>
</header>

<section class="section">
  <div class="section-head">
    <span class="tag">報到台查詢</span>
    <div class="meta">
      <strong>2026 年 8 月 15 日（六）</strong>　奇美醫院第五醫療大樓 5F 國際會議廳
    </div>
  </div>

  <div class="query-card">
    <h2>報到台編號查詢</h2>
    <p class="lead">請輸入您報名時填寫的完整姓名，查詢應前往的報到台</p>

    <div class="search-row">
      <input id="nameInput" type="text" placeholder="例：王小明" autocomplete="off"
             inputmode="text" enterkeyhint="search" maxlength="20" aria-label="姓名">
      <button id="searchBtn" class="btn-search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        查詢
      </button>
    </div>

    <p class="hint">
      姓名請<strong>不加空格</strong>完整輸入；查無資料時請洽現場工作人員。
    </p>

    <div id="result"></div>
    <div class="reset-bar" id="resetBar" style="display:none">
      <button class="btn-reset" onclick="resetAll()">↺ 重新查詢</button>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-main">2026 年會員大會暨學術研討會｜報到台編號查詢</div>
  © 台灣醫事聯合臨床技能發展學會 · All rights reserved.
</footer>

<script>
/* ============================================================
   設定區：部署 Apps Script 後，把 /exec 網址貼到下面
   ============================================================ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyVK_hjG6hO1hEUdvuXZEQfkImAVpYTKd12eGK7m8KO32bXOiZX3KzZgY-K6QNdCX5O/exec';

/* 無操作自動清空（現場立牌用，避免上一位的資料留在螢幕上） */
const IDLE_RESET_MS = 45000;

/* 以大字呈現的主要欄位 */
const DESK_LABEL = '報到台編號';

const input    = document.getElementById('nameInput');
const btn      = document.getElementById('searchBtn');
const result   = document.getElementById('result');
const resetBar = document.getElementById('resetBar');
let idleTimer = null;
let jsonpSeq  = 0;

function scheduleIdleReset() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(resetAll, IDLE_RESET_MS);
}

function resetAll() {
  clearTimeout(idleTimer);
  result.innerHTML = '';
  resetBar.style.display = 'none';
  input.value = '';
  btn.disabled = false;
  input.focus();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* 以 JSONP 呼叫 GAS，避開 Apps Script 的跨網域限制 */
function jsonp(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    const cb = 'tsmcsdCb' + (++jsonpSeq) + '_' + Date.now();
    const script = document.createElement('script');
    const timer = setTimeout(function () { cleanup(); reject(new Error('TIMEOUT')); }, timeoutMs || 12000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cb] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); reject(new Error('NETWORK')); };
    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(script);
  });
}

async function search() {
  const q = input.value.trim();
  if (q.length < 2) {
    showMessage('', '請輸入完整姓名', '姓名至少需 2 個字，例如「王小明」。');
    return;
  }

  btn.disabled = true;
  resetBar.style.display = 'none';
  result.innerHTML = '<div class="loading"><div class="spinner"></div>查詢中，請稍候…</div>';

  try {
    const data = await jsonp(GAS_URL + '?q=' + encodeURIComponent(q));
    render(data, q);
  } catch (err) {
    showMessage('msg-error', '連線失敗', '目前無法連線至查詢系統，請稍後再試或洽現場工作人員。');
  } finally {
    btn.disabled = false;
    resetBar.style.display = 'block';
    scheduleIdleReset();
  }
}

function render(data, q) {
  if (!data || data.ok !== true) {
    showMessage('msg-error', '查詢發生問題', '請洽現場工作人員協助。');
    return;
  }
  if (data.count === 0) {
    showMessage('', '查無「' + esc(q) + '」的報名資料',
      '可能原因：姓名輸入有誤、報名尚在處理中，或以不同姓名完成報名。<br>請洽現場工作人員為您查詢。');
    return;
  }

  let results = data.results;
  const desks = results.map(function (r) {
    const d = r.fields.filter(function (f) { return f.label === DESK_LABEL; })[0];
    return d ? d.value : '';
  });
  const allSameDesk = desks.every(function (d) { return d === desks[0]; });
  let mergedSameName = false;

  let html = '';
  if (results.length > 1 && allSameDesk) {
    /* 同名同姓一律分配在同一報到台 → 合併為一張卡。
       此時不顯示服務單位／職類，避免在公開螢幕上秀出另一位同名者的資料。 */
    results = [results[0]];
    mergedSameName = true;
  } else if (results.length > 1) {
    html += '<div class="msg" style="margin-bottom:1rem"><strong>查到 ' + results.length +
            ' 筆同名資料</strong>報到台編號不一致，請洽現場工作人員協助確認。</div>';
  }

  results.forEach(function (rec) {
    const nameField = rec.fields.filter(function (f) { return f.label === '姓名'; })[0];
    const deskField = rec.fields.filter(function (f) { return f.label === DESK_LABEL; })[0];
    const others    = mergedSameName ? [] : rec.fields.filter(function (f) {
      return f.label !== '姓名' && f.label !== DESK_LABEL;
    });

    html += '<div class="record">';
    html += '<div class="record-header"><span class="name-main">' +
            esc(nameField ? nameField.value : q) + '</span></div>';

    if (deskField) {
      html += '<div class="desk-block">' +
              '<div class="desk-label">報到台編號</div>' +
              '<div class="desk-value">' + esc(deskField.value) + '</div>' +
              '<div class="desk-note">請至 <b>' + esc(deskField.value) +
              ' 號報到台</b>報到，由工作人員為您完成報到、領取識別證</div>' +
              '</div>';
    }

    others.forEach(function (f) {
      html += '<div class="field-row"><div class="field-label">' + esc(f.label) +
              '</div><div class="field-value">' + esc(f.value) + '</div></div>';
    });
    html += '</div>';
  });

  result.innerHTML = html;
}

function showMessage(cls, title, body) {
  result.innerHTML = '<div class="msg ' + cls + '"><strong>' + title + '</strong>' + body + '</div>';
  resetBar.style.display = 'block';
  scheduleIdleReset();
}

btn.addEventListener('click', search);
input.addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
input.addEventListener('input', scheduleIdleReset);
window.addEventListener('load', function () { input.focus(); });
</script>
</body>
</html>
