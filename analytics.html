<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSMCSD 2026年會 | 滿意度調查分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --deep-blue: #1a3a5c;
  --nav-blue: #1A5D99;
  --medium-blue: #2c6fA0;
  --mist-blue: #6a9ec0;
  --light-blue: #a8cfea;
  --pale-blue: #d6e9f5;
  --ice-blue: #eaf3fa;
  --warm-gold: #d4a843;
  --light-gold: #f0d68a;
  --pale-gold: #fdf5e0;
  --coral: #e07855;
  --red: #e74c3c;
  --white: #ffffff;
  --text-dark: #1a2a3a;
  --text-body: #2c3e50;
  --text-muted: #6b7c8d;
  --card-shadow: 0 4px 20px rgba(26,93,153,0.08);
  --card-radius: 16px;
  --font-main: 'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  color: var(--text-body);
  background: var(--ice-blue);
  line-height: 1.7;
  padding-top: 58px;
  -webkit-font-smoothing: antialiased;
}

/* Header (與手冊一致的 fixed nav) */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(26,93,153,0.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 2px 12px rgba(26,93,153,0.2);
}
.header-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.55rem 1.5rem;
}
.header-logo {
  display: flex; align-items: center; gap: 0.6rem;
  color: var(--white); font-weight: 700; font-size: 0.92rem;
  text-decoration: none;
}
.header-logo .logo-img {
  width: 36px; height: 36px; border-radius: 50%;
  object-fit: contain; background: rgba(255,255,255,0.95); padding: 2px;
}
.header-logo .logo-text { line-height: 1.2; }
.header-logo .logo-text small {
  display: block; font-size: 0.72rem; font-weight: 400;
  opacity: 0.85; margin-top: 1px;
}
.header-actions { display: flex; gap: 0.5rem; align-items: center; }
.back-btn, .refresh-btn {
  padding: 0.4rem 0.85rem; border-radius: 6px;
  background: rgba(255,255,255,0.15);
  color: var(--white); font-size: 0.82rem; font-weight: 500;
  text-decoration: none; border: none; cursor: pointer;
  font-family: var(--font-main);
  transition: background 0.2s;
  display: inline-flex; align-items: center; gap: 0.3rem;
}
.back-btn:hover, .refresh-btn:hover { background: rgba(255,255,255,0.25); }

/* Container */
.container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

/* Page title */
.page-title {
  text-align: center; margin: 1rem 0 2rem;
}
.page-title h1 {
  color: var(--deep-blue);
  font-size: clamp(1.5rem, 3.5vw, 2rem);
  font-weight: 900; margin-bottom: 0.3rem;
  letter-spacing: 0.05em;
}
.page-title .subtitle {
  color: var(--text-muted); font-size: 0.95rem;
}
.page-title .meta {
  display: inline-flex; align-items: center; gap: 0.5rem;
  margin-top: 0.6rem; padding: 0.35rem 0.9rem;
  background: var(--white); border-radius: 99px;
  font-size: 0.82rem; color: var(--text-muted);
  box-shadow: var(--card-shadow);
}

/* Section */
.section {
  margin-bottom: 2rem;
}
.section-head {
  display: flex; align-items: center; gap: 0.7rem;
  margin-bottom: 1rem;
}
.section-head .tag {
  display: inline-flex; align-items: center;
  background: var(--nav-blue); color: var(--white);
  padding: 0.32rem 0.85rem; border-radius: 6px;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em;
  line-height: 1;
}
.section-head h2 {
  color: var(--deep-blue); font-size: 1.15rem; font-weight: 700;
  letter-spacing: 0.05em;
}

/* Stat cards (overview) */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
}
.stat-card {
  background: var(--white);
  border-radius: var(--card-radius);
  padding: 1.3rem 1.2rem;
  box-shadow: var(--card-shadow);
  text-align: center;
  border-top: 4px solid var(--nav-blue);
}
.stat-card.gold { border-top-color: var(--warm-gold); }
.stat-card.coral { border-top-color: var(--coral); }
.stat-card.mist { border-top-color: var(--mist-blue); }
.stat-card h3 {
  color: var(--text-muted); font-size: 0.82rem; font-weight: 500;
  margin-bottom: 0.55rem; letter-spacing: 0.08em;
}
.stat-card .big-number {
  color: var(--deep-blue); font-size: 2.3rem; font-weight: 900;
  line-height: 1; margin-bottom: 0.2rem;
}
.stat-card .unit {
  color: var(--text-muted); font-size: 0.78rem;
}

/* Chart card */
.chart-grid {
  display: grid; gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
}
.chart-card {
  background: var(--white);
  border-radius: var(--card-radius);
  padding: 1.3rem 1.4rem 1.4rem;
  box-shadow: var(--card-shadow);
}
.chart-card h3 {
  color: var(--deep-blue); font-size: 1rem; font-weight: 700;
  margin-bottom: 0.9rem; padding-bottom: 0.6rem;
  border-bottom: 2px solid var(--pale-blue);
}
.chart-card .chart-container {
  position: relative; height: 280px;
}
.chart-card.wide {
  grid-column: 1 / -1;
}
.chart-card.wide .chart-container { height: 380px; }

/* Feedback list */
.feedback-block {
  background: var(--white);
  border-radius: var(--card-radius);
  padding: 1.3rem 1.4rem;
  box-shadow: var(--card-shadow);
  margin-bottom: 1rem;
}
.feedback-block h3 {
  color: var(--deep-blue); font-size: 1rem; font-weight: 700;
  margin-bottom: 0.9rem; padding-bottom: 0.6rem;
  border-bottom: 2px solid var(--pale-blue);
  display: flex; justify-content: space-between; align-items: baseline;
}
.feedback-block h3 .count {
  font-size: 0.78rem; color: var(--text-muted); font-weight: 400;
}
.feedback-list {
  display: flex; flex-direction: column; gap: 0.6rem;
  max-height: 400px; overflow-y: auto;
}
.feedback-item {
  padding: 0.7rem 0.85rem;
  background: var(--ice-blue);
  border-left: 3px solid var(--nav-blue);
  border-radius: 0 8px 8px 0;
  font-size: 0.88rem; color: var(--text-body);
  line-height: 1.65; white-space: pre-line;
}
.feedback-empty {
  text-align: center; color: var(--text-muted);
  padding: 1.5rem; font-size: 0.9rem;
}

/* Loading / Error states */
.state {
  text-align: center; padding: 4rem 1rem;
  color: var(--text-muted);
}
.state .icon { font-size: 3rem; margin-bottom: 0.6rem; opacity: 0.6; }
.state h3 { color: var(--text-dark); margin-bottom: 0.5rem; }
.state .retry-btn {
  margin-top: 1rem; padding: 0.6rem 1.4rem;
  background: var(--nav-blue); color: var(--white);
  border: none; border-radius: 99px; cursor: pointer;
  font-family: var(--font-main); font-size: 0.9rem; font-weight: 600;
}

/* Spinner */
.spinner {
  display: inline-block;
  width: 40px; height: 40px;
  border: 3px solid var(--pale-blue);
  border-top-color: var(--nav-blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 0.8rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.site-footer {
  background: #1A5D99;
  color: rgba(255,255,255,0.7);
  text-align: center; padding: 1.5rem 1.2rem;
  font-size: 0.82rem; line-height: 1.7;
  margin-top: 2rem;
}

/* Mobile */
@media (max-width: 768px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .chart-grid { grid-template-columns: 1fr; }
  .stat-card .big-number { font-size: 1.9rem; }
  .header-logo .logo-text small { display: none; }
  .back-btn, .refresh-btn { padding: 0.35rem 0.6rem; font-size: 0.76rem; }
}

/* ════════════════════════════════════════════════════════════════
   列印 / 匯出 PDF
   ════════════════════════════════════════════════════════════════ */
.print-btn {
  display: inline-flex; align-items: center; gap: 0.35rem;
  background: var(--warm-gold); color: #fff; border: none;
  padding: 0.4rem 0.8rem; border-radius: 8px;
  font-family: var(--font-main); font-size: 0.8rem; font-weight: 500;
  cursor: pointer; transition: background 0.2s;
}
.print-btn:hover { background: #c2963a; }
.chart-print-img { display: none; }
.print-only { display: none; }

@media print {
  @page { size: A4 portrait; margin: 12mm 10mm 12mm 10mm; }

  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  html, body {
    background: #fff !important;
    padding-top: 0 !important;
    font-size: 10.5pt;
    line-height: 1.5;
  }

  /* 不列印的元素 */
  .site-header, .site-footer, .header-actions,
  .back-btn, .refresh-btn, .print-btn,
  .retry-btn, .no-print, .spinner { display: none !important; }

  .print-only { display: block !important; }

  .container { max-width: none !important; padding: 0 !important; }

  .page-title { margin: 0 0 8mm !important; }
  .page-title h1 { font-size: 19pt !important; }
  .page-title .subtitle { font-size: 10pt; }
  .page-title .meta { box-shadow: none !important; border: 1px solid var(--pale-blue); }
  .print-org {
    font-size: 10pt; font-weight: 700; color: var(--nav-blue);
    letter-spacing: 0.08em; margin-bottom: 0.2rem;
  }

  /* 區塊不被切斷 */
  .section { margin-bottom: 7mm !important; break-inside: avoid; page-break-inside: avoid; }
  .section-head { break-after: avoid; page-break-after: avoid; }
  .section-head h2 { font-size: 13pt !important; }
  .chart-card, .stat-card, .feedback-block, .table-wrap, .chart-grid > * {
    break-inside: avoid; page-break-inside: avoid;
    box-shadow: none !important;
    border: 1px solid var(--pale-blue);
  }

  /* 圖表改用列印用點陣圖，避免 canvas 縮放失真 */
  .chart-container, .chart-card .chart-container { height: auto !important; }
  canvas { display: none !important; }
  .chart-print-img {
    display: block !important;
    width: 100% !important; height: auto !important;
  }

  a { color: inherit !important; text-decoration: none !important; }
}

</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="header-inner">
    <a href="handbook.html" class="header-logo">
      <img src="https://raw.githubusercontent.com/ling3567/2026annualconference/main/images/TSMCSD-logo.png" alt="TSMCSD" class="logo-img">
      <span class="logo-text">
        台灣醫事聯合臨床技能發展學會
        <small>2026 滿意度調查分析</small>

    </a>

        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>

      </a>

        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        重新載入
      </button>
      <button class="print-btn" id="print-btn" title="匯出成 PDF（列印）">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        匯出 PDF
      </button>

</header>

<main class="container">

  <div class="page-title">
    <div class="print-only print-org">台灣醫事聯合臨床技能發展學會</div>
    <h1>滿意度調查分析</h1>
    <p class="subtitle">2026 年會員大會暨學術研討會 · 與會者回饋統計</p>
    <div class="meta" id="page-meta">
      <span class="spinner" style="width:12px;height:12px;border-width:2px;margin:0"></span>
      載入中…
    </div>
  </div>

  <div id="content">
    <!-- Loading state (will be replaced) -->
    <div class="state">
      <div class="spinner"></div>
      <h3>正在載入調查資料…</h3>
    </div>
  </div>

</main>

<footer class="site-footer">
  <div>2026 年會員大會暨學術研討會｜滿意度調查分析</div>
  © 台灣醫事聯合臨床技能發展學會 · All rights reserved.
</footer>

<script>
/* ════════════════════════════════════════════════════════════════
   1. 設定
   ════════════════════════════════════════════════════════════════ */
const DATA_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx-L6y0Dpz_gBCkHYkiUkKVaK3-93q7CoE3tW1aMb5LrwR56cEOn1nryggjvwctw3u8/exec?action=data';

// Likert 色階（5 分色從深藍→暖金→珊瑚→紅）
const LIKERT_COLORS = {
  5: '#1A5D99',   // 最正面 - 深藍
  4: '#6a9ec0',   // 正面 - 淺藍
  3: '#d4a843',   // 中性 - 金色
  2: '#e07855',   // 負面 - 珊瑚
  1: '#e74c3c',   // 最負面 - 紅
  'N/A': '#cbd5e0', // 灰
};
const LIKERT_LABELS_OVERALL = {
  5: '非常同意', 4: '同意', 3: '普通', 2: '不同意', 1: '非常不同意',
};
const LIKERT_LABELS_SESSION = {
  5: '非常有幫助', 4: '有幫助', 3: '普通', 2: '幫助不大', 1: '完全沒有幫助', 'N/A': '未參與或不適用',
};
const LIKERT_LABELS_SATISFACTION = {
  5: '非常滿意', 4: '滿意', 3: '普通', 2: '不滿意', 1: '非常不滿意',
};

// 8 題整體評估題目
const OVERALL_QUESTIONS = [
  '本次議程主題符合我對臨床教學與醫學教育實務的學習需求',
  '本次研討會有助於我理解醫學教育目前的重要發展方向',
  '本次研討會內容兼具理論觀念與實務應用',
  '本次研討會有助於我思考如何將所學應用於臨床教學、課程設計或教育訓練相關工作',
  '我能從本次研討會中帶回至少一項可應用於工作場域的做法',
  '本次研討會整體時數與活動安排適當',
  '本次活動場地、設備與行政安排能支持學習需求',
  '我願意推薦同事或其他對醫學教育有興趣者參加本學會未來辦理之研討會',
];

// 5 場次名稱
const SESSIONS = [
  '當壓力成為日常：醫療現場的心理韌性練習',
  '能力導向醫學教育中的教學設計：從課程架構到臨床實踐',
  '事半功倍的教學：AI工具在教案製作的應用',
  '從評量到信賴：OSCE、EPA與CCC連結臨床能力培養與總結性能力評定',
  '在高壓醫療環境中，如何系統性支持臨床教師的學術發展',
];

/* Chart.js 預設 */
Chart.defaults.font.family = "'Noto Sans TC', sans-serif";
Chart.defaults.font.size = 12;
Chart.defaults.color = '#2c3e50';

/* ════════════════════════════════════════════════════════════════
   2. 資料抓取
   ════════════════════════════════════════════════════════════════ */
let currentCharts = [];

async function loadData() {
  document.getElementById('content').innerHTML = `
    <div class="state">
      <div class="spinner"></div>
      <h3>正在載入調查資料…</h3>
    </div>`;
  document.getElementById('page-meta').innerHTML = `
    <span class="spinner" style="width:12px;height:12px;border-width:2px;margin:0"></span>
    載入中…`;

  try {
    const res = await fetch(DATA_ENDPOINT);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '未知錯誤');
    renderAll(json);
  } catch (err) {
    document.getElementById('content').innerHTML = `
      <div class="state">
        <div class="icon">⚠️</div>
        <h3>資料載入失敗</h3>
        <p>${escapeHtml(err.message)}</p>
        <button class="retry-btn" onclick="loadData()">重試</button>
      </div>`;
    document.getElementById('page-meta').textContent = '載入失敗';
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadData);

/* ════════════════════════════════════════════════════════════════
   3. 主渲染
   ════════════════════════════════════════════════════════════════ */
function renderAll(json) {
  const rows = json.rows || [];
  const count = json.count || 0;

  // 更新 meta
  const now = new Date();
  const timeStr = now.toLocaleString('zh-TW', { hour12: false });
  document.getElementById('page-meta').innerHTML =
    `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
     最後更新：${timeStr}`;

  if (count === 0) {
    document.getElementById('content').innerHTML = `
      <div class="state">
        <div class="icon">📋</div>
        <h3>目前尚無資料</h3>
        <p>還沒有人填寫滿意度調查，收到回饋後這頁會自動顯示分析結果。</p>
        <button class="retry-btn" onclick="loadData()">重新檢查</button>
      </div>`;
    return;
  }

  // 銷毀舊圖表
  currentCharts.forEach(c => c.destroy());
  currentCharts = [];

  // 組裝 HTML
  document.getElementById('content').innerHTML = `
    ${sectionOverview(rows, count)}
    ${sectionDemographics(rows)}
    ${sectionOverall(rows)}
    ${sectionSessions(rows)}
    ${sectionSatisfaction(rows)}
    <div class="no-print">
      ${sectionSegmentation(rows)}
      ${sectionFeedback(rows)}
    </div>
  `;

  // 渲染圖表
  renderDemographicsCharts(rows);
  renderOverallChart(rows);
  renderSessionsChart(rows);
  renderSatisfactionChart(rows);
  renderSegmentationChart(rows);
}

/* ════════════════════════════════════════════════════════════════
   4. 概覽數據
   ════════════════════════════════════════════════════════════════ */
function sectionOverview(rows, count) {
  const avgSatisfaction = avg(rows.map(r => Number(r['整體滿意度'])).filter(n => n >= 1 && n <= 5));
  const avgOverall = avg(rows.flatMap(r =>
    Array.from({length: 8}, (_, i) => Number(r['整體評估_' + (i+1)])).filter(n => n >= 1 && n <= 5)
  ));
  const recommendScores = rows.map(r => Number(r['整體評估_8'])).filter(n => n >= 1 && n <= 5);
  const willRecommend = recommendScores.filter(n => n >= 4).length;
  const recommendRate = recommendScores.length > 0
    ? Math.round((willRecommend / recommendScores.length) * 100)
    : 0;

  return `
    <section class="section">
      <div class="section-head">
        <span class="tag">OVERVIEW</span>
        <h2>總覽數據</h2>
      </div>
      <div class="stat-grid">
        <div class="stat-card">
          <h3>總回覆數</h3>
          <div class="big-number">${count}</div>
          <div class="unit">份</div>
        </div>
        <div class="stat-card gold">
          <h3>整體滿意度</h3>
          <div class="big-number">${avgSatisfaction.toFixed(2)}</div>
          <div class="unit">平均 / 5.0</div>
        </div>
        <div class="stat-card mist">
          <h3>整體評估平均</h3>
          <div class="big-number">${avgOverall.toFixed(2)}</div>
          <div class="unit">8 題平均 / 5.0</div>
        </div>
        <div class="stat-card coral" title="Q8：我願意推薦同事或其他對醫學教育有興趣者參加本學會未來辦理之研討會">
          <h3>推薦意願（Q8）</h3>

        legend: { position: 'right', labels: { boxWidth: 14, font: { size: 11 } } },

/* ════════════════════════════════════════════════════════════════
   8b. 分群深入分析：低滿意 vs 高滿意族群比較
   ════════════════════════════════════════════════════════════════ */
function sectionSegmentation(rows) {
  // 依「任一題（整體評估或場次）曾給 ≤ 2 分」判定為低滿意族群
  // 這比單看「整體滿意度」寬鬆，能捕捉「整體給高分但個別項目給低分」的受訪者
  const allKeys = [
    ...Array.from({length: 8}, (_, i) => '整體評估_' + (i+1)),
    ...SESSIONS.map(s => '場次_' + s),
    '整體滿意度',
  ];
  function minScoreOf(r) {
    const nums = allKeys.map(k => Number(r[k])).filter(n => n >= 1 && n <= 5);
    return nums.length ? Math.min(...nums) : null;
  }
  const groups = { high: [], mid: [], low: [] };
  rows.forEach(r => {
    const m = minScoreOf(r);
    if (m === null) return;
    if (m <= 2) groups.low.push(r);
    else if (m === 3) groups.mid.push(r);
    else groups.high.push(r);   // 所有題目都 ≥ 4
  });
  const nHigh = groups.high.length, nMid = groups.mid.length, nLow = groups.low.length;

  // 若完全沒人給過 3 分以下（大家都很滿意）→ 顯示提示但不做比較
  if (nLow === 0 && nMid === 0) {
    return `
      <section class="section">
        <div class="section-head">
          <span class="tag">SEGMENT ANALYSIS</span>
          <h2>分群深入分析</h2>
        </div>
        <div class="feedback-block">
          <div class="feedback-empty" style="padding: 2rem 1rem;">
            🎉 太好了！所有受訪者的每一題評分都 ≥ 4 分，沒有需要特別關注的低滿意群體。
          </div>
        </div>
      </section>`;
  }

  // 收集所有可比較項目（8 整體評估 + 5 場次）
  const items = [
    ...OVERALL_QUESTIONS.map((text, i) => ({
      shortLabel: `整體 Q${i+1}`,
      fullText: text,
      key: '整體評估_' + (i+1),
    })),
    ...SESSIONS.map((text, i) => ({
      shortLabel: `場次 ${i+1}`,
      fullText: text,
      key: '場次_' + text,
    })),
  ];

  // 計算每項在高/低族群的平均（場次的 N/A 排除）
  const analysis = items.map(item => {
    const highScores = groups.high.map(r => Number(r[item.key])).filter(n => n >= 1 && n <= 5);
    const lowScores = groups.low.map(r => Number(r[item.key])).filter(n => n >= 1 && n <= 5);
    const highAvg = avg(highScores);
    const lowAvg = avg(lowScores);
    return { ...item, highAvg, lowAvg, gap: highAvg - lowAvg };
  });

  // 找出「低滿意族群仍肯定的題目」= 低組平均 ≥ 3.5
  const stillPositive = analysis.filter(a => nLow > 0 && a.lowAvg >= 3.5).sort((a, b) => b.lowAvg - a.lowAvg);
  // 找出「差距最大的題目」= 高低差距 ≥ 1.0
  const bigGap = analysis.filter(a => nLow > 0 && a.gap >= 1.0).sort((a, b) => b.gap - a.gap);

  // 個案亮點：普通/低族群中，有人給了 5 分的題目（找出「個別驚喜」）
  const midLowGroup = [...groups.mid, ...groups.low];
  const outlierBrights = items.map(item => {
    const fiveScorers = midLowGroup.filter(r => Number(r[item.key]) === 5).length;
    const fourScorers = midLowGroup.filter(r => Number(r[item.key]) === 4).length;
    return { ...item, fiveScorers, fourScorers };
  }).filter(a => a.fiveScorers > 0)
    .sort((a, b) => b.fiveScorers - a.fiveScorers || b.fourScorers - a.fourScorers);

  return `
    <section class="section">
      <div class="section-head">
        <span class="tag">SEGMENT ANALYSIS</span>
        <h2>分群深入分析</h2>
      </div>

      <p style="text-align:center;color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem;line-height:1.6;">
        依「所有題目中最低分數」進行分群（整體評估 8 題 + 5 場次 + 整體滿意度，共 14 題）
      </p>

      <div class="stat-grid" style="margin-bottom: 1.2rem">
        <div class="stat-card gold">
          <h3>高滿意族群</h3>
          <div class="big-number">${nHigh}</div>
          <div class="unit">每一題都 ≥ 4 分</div>
        </div>
        <div class="stat-card mist">
          <h3>普通族群</h3>
          <div class="big-number">${nMid}</div>
          <div class="unit">最低分 = 3 分</div>
        </div>
        <div class="stat-card coral">
          <h3>低滿意族群</h3>
          <div class="big-number">${nLow}</div>
          <div class="unit">有題目 ≤ 2 分</div>
        </div>
      </div>

      ${nLow === 0 ? `
        <div class="feedback-block">
          <div class="feedback-empty">目前沒有整體滿意度 ≤ 2 的回覆，暫無「低滿意族群」比較資料。</div>
        </div>
      ` : `
        <div class="chart-card wide" style="margin-bottom: 1rem">
          <h3>各題平均分數：高滿意族群 vs 低滿意族群</h3>
          <div class="chart-container" style="height: 500px"><canvas id="chart-segment"></canvas></div>
        </div>

        ${stillPositive.length > 0 ? `
          <div class="feedback-block">
            <h3>💡 低滿意族群仍給予肯定的項目 <span class="count">共 ${stillPositive.length} 項（平均 ≥ 3.5）</span></h3>
            <div style="padding: 0.5rem 0;">
              ${stillPositive.map(a => `
                <div style="display: grid; grid-template-columns: 5.5rem 1fr auto; gap: 0.7rem; padding: 0.55rem 0; border-bottom: 1px dashed var(--pale-blue); align-items: center;">
                  <span style="font-size: 0.78rem; font-weight: 700; color: var(--nav-blue); background: var(--ice-blue); padding: 0.2rem 0.5rem; border-radius: 5px; text-align: center;">${escapeHtml(a.shortLabel)}</span>
                  <span style="font-size: 0.87rem; color: var(--text-body); line-height: 1.5;">${escapeHtml(a.fullText)}</span>
                  <span style="font-size: 0.85rem; color: var(--text-muted); white-space: nowrap;">低組 <strong style="color: var(--warm-gold); font-size: 0.95rem;">${a.lowAvg.toFixed(2)}</strong> ／ 高組 ${a.highAvg.toFixed(2)}</span>
                </div>
              `).join('')}
            </div>
            <p style="margin-top: 0.7rem; font-size: 0.82rem; color: var(--text-muted); line-height: 1.6;">
              💬 這些項目「即使不滿意研討會整體的人也給予肯定」，代表**普遍受歡迎**的內容，未來可作為固定安排。
            </p>
          </div>
        ` : ''}

        ${bigGap.length > 0 ? `
          <div class="feedback-block">
            <h3>⚠️ 兩族群評分差距較大的項目 <span class="count">共 ${bigGap.length} 項（差距 ≥ 1.0）</span></h3>
            <div style="padding: 0.5rem 0;">
              ${bigGap.map(a => `
                <div style="display: grid; grid-template-columns: 5.5rem 1fr auto; gap: 0.7rem; padding: 0.55rem 0; border-bottom: 1px dashed var(--pale-blue); align-items: center;">
                  <span style="font-size: 0.78rem; font-weight: 700; color: var(--coral); background: #fff2ec; padding: 0.2rem 0.5rem; border-radius: 5px; text-align: center;">${escapeHtml(a.shortLabel)}</span>
                  <span style="font-size: 0.87rem; color: var(--text-body); line-height: 1.5;">${escapeHtml(a.fullText)}</span>
                  <span style="font-size: 0.85rem; color: var(--text-muted); white-space: nowrap;">差距 <strong style="color: var(--coral); font-size: 0.95rem;">${a.gap.toFixed(2)}</strong>（低 ${a.lowAvg.toFixed(2)} → 高 ${a.highAvg.toFixed(2)}）</span>
                </div>
              `).join('')}
            </div>
            <p style="margin-top: 0.7rem; font-size: 0.82rem; color: var(--text-muted); line-height: 1.6;">
              💬 這些項目「高低滿意族群感受差異大」，可能是低滿意族群主要不滿的來源，適合作為**未來優先改進**方向。
            </p>
          </div>
        ` : ''}

        ${midLowGroup.length > 0 ? (() => {
          // 每位個案的評分明細（用原始 rows 順序當匿名編號）
          const cases = midLowGroup.map(r => {
            const idx = rows.indexOf(r) + 1;
            const overall = Number(r['整體滿意度']);
            const prof = r['職類別'] || '(未填)';
            const profDisplay = (prof === '__OTHER__' || String(prof).startsWith('其他：')) ? '其他' : prof;

            const scoredItems = items.map(item => {
              const s = Number(r[item.key]);
              return (s >= 1 && s <= 5) ? { ...item, score: s } : null;
            }).filter(Boolean);

            const fives = scoredItems.filter(x => x.score === 5);
            const fours = scoredItems.filter(x => x.score === 4);
            const lows = scoredItems.filter(x => x.score <= 3);
            const scoresOnly = scoredItems.map(x => x.score);
            const min = scoresOnly.length ? Math.min(...scoresOnly) : null;
            const max = scoresOnly.length ? Math.max(...scoresOnly) : null;
            const gap = max - min;
            return { idx, prof: profDisplay, overall, fives, fours, lows, min, max, gap };
          }).sort((a, b) => b.fives.length - a.fives.length || b.gap - a.gap || a.idx - b.idx);
          // 顯示全部：先排「有 5 分且落差大」的個案，最後才是「評分平坦」的個案

          if (cases.length === 0) return '';

          return `
          <div class="feedback-block">
            <h3>⭐ 個案級評分明細 <span class="count">共 ${cases.length} 位（普通 + 低滿意族群完整列出）</span></h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
              下方每張卡片為一位受訪者的評分模式，依「亮點程度」由高至低排列，方便快速掃視。
            </p>
            <div style="display: flex; flex-direction: column; gap: 0.9rem;">
              ${cases.map(c => `
                <div style="background: var(--white); border: 1px solid var(--pale-blue); border-radius: 12px; padding: 1rem 1.1rem; box-shadow: 0 1px 4px rgba(26,93,153,0.05);">
                  <!-- Header -->
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; padding-bottom: 0.6rem; border-bottom: 2px solid var(--pale-blue); margin-bottom: 0.7rem;">
                    <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                      <span style="background: var(--nav-blue); color: var(--white); padding: 0.25rem 0.7rem; border-radius: 6px; font-size: 0.78rem; font-weight: 700;">案例 #${c.idx}</span>
                      <span style="font-size: 0.85rem; color: var(--text-body);">${escapeHtml(c.prof)}</span>
                      <span style="font-size: 0.82rem; color: var(--text-muted);">整體滿意度 <strong style="color: var(--deep-blue);">${c.overall}</strong>　最低分 <strong style="color: var(--coral);">${c.min}</strong>　最高分 <strong style="color: var(--warm-gold);">${c.max}</strong>${c.gap >= 2 ? `　落差 <strong style="color: var(--coral);">${c.gap}</strong>` : ''}</span>
                    </div>
                  </div>

                  <!-- 5 star items -->
                  ${c.fives.length > 0 ? `
                    <div style="margin-bottom: 0.6rem;">
                      <div style="font-size: 0.82rem; color: #8a6418; font-weight: 700; margin-bottom: 0.35rem;">🌟 給 5 分（${c.fives.length} 項）</div>
                      <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
                        ${c.fives.map(f => `<span style="background: var(--pale-gold); color: #8a6418; padding: 0.22rem 0.55rem; border-radius: 5px; font-size: 0.78rem;" title="${escapeHtml(f.fullText)}">${escapeHtml(f.shortLabel)}</span>`).join('')}
                      </div>
                    </div>
                  ` : ''}

                  <!-- 4 star items -->
                  ${c.fours.length > 0 ? `
                    <div style="margin-bottom: 0.6rem;">
                      <div style="font-size: 0.82rem; color: var(--nav-blue); font-weight: 700; margin-bottom: 0.35rem;">👍 給 4 分（${c.fours.length} 項）</div>
                      <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
                        ${c.fours.map(f => `<span style="background: var(--ice-blue); color: var(--nav-blue); padding: 0.22rem 0.55rem; border-radius: 5px; font-size: 0.78rem;" title="${escapeHtml(f.fullText)}">${escapeHtml(f.shortLabel)}</span>`).join('')}
                      </div>
                    </div>
                  ` : ''}

                  <!-- ≤3 items -->
                  ${c.lows.length > 0 ? `
                    <div>
                      <div style="font-size: 0.82rem; color: var(--coral); font-weight: 700; margin-bottom: 0.35rem;">⚠️ 給 ≤ 3 分（${c.lows.length} 項）</div>
                      <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                        ${c.lows.map(f => `<div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.28rem 0.5rem; background: #fff2ec; border-left: 3px solid var(--coral); border-radius: 4px;">
                          <span style="font-size: 0.78rem; font-weight: 700; color: var(--coral); min-width: 2.2rem;">${f.score} 分</span>
                          <span style="font-size: 0.8rem; color: var(--text-body); flex: 1;">${escapeHtml(f.shortLabel)}：${escapeHtml(f.fullText)}</span>
                        </div>`).join('')}
                      </div>
                    </div>
                  ` : ''}

                  <!-- Interpretation hint (auto-generated) -->
                  ${(() => {
                    if (c.fives.length >= 5 && c.lows.length <= 2) {
                      return `<div style="margin-top: 0.75rem; padding-top: 0.55rem; border-top: 1px dashed var(--pale-blue); font-size: 0.8rem; color: var(--text-muted); line-height: 1.55;">
                        💬 這位對整體研討會給 ${c.overall} 分，但${c.fives.length >= 10 ? '幾乎所有項目' : c.fives.length + ' 個項目'}都給 5 分。${c.lows.length === 0 ? '沒有明顯不滿的項目，可能只是保守評分。' : `主要不滿意的是：${c.lows.map(l => l.shortLabel).join('、')}，值得訪談了解原因。`}
                      </div>`;
                    }
                    if (c.gap === 0 && c.min === 3) {
                      return `<div style="margin-top: 0.75rem; padding-top: 0.55rem; border-top: 1px dashed var(--pale-blue); font-size: 0.8rem; color: var(--text-muted); line-height: 1.55;">
                        💬 全部項目一致給 3 分（普通），無明顯高低亮點。可能是**保守型作答**、或整體感受平淡；適合看開放式回饋補充理解。
                      </div>`;
                    }
                    if (c.min <= 2 && c.fives.length === 0) {
                      return `<div style="margin-top: 0.75rem; padding-top: 0.55rem; border-top: 1px dashed var(--pale-blue); font-size: 0.8rem; color: var(--text-muted); line-height: 1.55;">
                        💬 這位對特定項目明確不滿意（${c.lows.filter(l => l.score <= 2).length} 項給 ≤ 2 分），且沒有任何項目給 5 分。屬於**整體感受不佳**的個案，建議查看開放式回饋了解具體原因。
                      </div>`;
                    }
                    if (c.gap >= 2) {
                      return `<div style="margin-top: 0.75rem; padding-top: 0.55rem; border-top: 1px dashed var(--pale-blue); font-size: 0.8rem; color: var(--text-muted); line-height: 1.55;">
                        💬 這位的評分**落差較大**（${c.min} ~ ${c.max}），對不同項目感受兩極。可能對某些內容特別有共鳴、對某些不感興趣。
                      </div>`;
                    }
                    return '';
                  })()}
                </div>
              `).join('')}
            </div>
          </div>
          `;
        })() : ''}
      `}
    </section>`;
}

function renderSegmentationChart(rows) {
  const canvas = document.getElementById('chart-segment');
  if (!canvas) return;

  // 沿用「任一題最低分」判定，與 sectionSegmentation 一致
  const allKeys = [
    ...Array.from({length: 8}, (_, i) => '整體評估_' + (i+1)),
    ...SESSIONS.map(s => '場次_' + s),
    '整體滿意度',
  ];
  const groups = { high: [], low: [] };
  rows.forEach(r => {
    const nums = allKeys.map(k => Number(r[k])).filter(n => n >= 1 && n <= 5);
    if (!nums.length) return;
    const m = Math.min(...nums);
    if (m >= 4) groups.high.push(r);
    else if (m <= 2) groups.low.push(r);
  });
  if (groups.low.length === 0) return;

  const items = [
    ...OVERALL_QUESTIONS.map((text, i) => ({ shortLabel: `整體 Q${i+1}`, key: '整體評估_' + (i+1), fullText: text })),
    ...SESSIONS.map((text, i) => ({ shortLabel: `場次 ${i+1}`, key: '場次_' + text, fullText: text })),
  ];

  const labels = items.map(item => item.shortLabel);
  const highData = items.map(item => {
    const scores = groups.high.map(r => Number(r[item.key])).filter(n => n >= 1 && n <= 5);
    return avg(scores).toFixed(2);
  });
  const lowData = items.map(item => {
    const scores = groups.low.map(r => Number(r[item.key])).filter(n => n >= 1 && n <= 5);
    return avg(scores).toFixed(2);
  });

  currentCharts.push(new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: `高滿意族群平均 (N=${groups.high.length})`,
          data: highData,
          backgroundColor: '#1A5D99',
          borderRadius: 4,
        },
        {
          label: `低滿意族群平均 (N=${groups.low.length})`,
          data: lowData,
          backgroundColor: '#e07855',
          borderRadius: 4,
        },
      ],
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 14 } },
        tooltip: {
          callbacks: {
            title: (items) => {
              const idx = items[0].dataIndex;
              const dataIdx = idx < 8 ? idx : idx - 8;
              const src = idx < 8 ? OVERALL_QUESTIONS : SESSIONS;
              return src[dataIdx];
            },
            label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.x}`,
          },
        },
      },
      scales: {
        x: { beginAtZero: true, max: 5, ticks: { stepSize: 1 } },
        y: { ticks: { autoSkip: false, font: { size: 11 } } },
      },
    },
  }));
}

/* ════════════════════════════════════════════════════════════════
   9. 開放式回饋
   ════════════════════════════════════════════════════════════════ */
function sectionFeedback(rows) {
  const fields = [
    { key: '最有幫助內容', label: '1. 本次研討會中，對您最有幫助的一項內容是什麼？' },
    { key: '未來希望主題', label: '2. 未來希望學會再規劃哪些主題或課程？' },
    { key: '其他建議或回饋', label: '3. 其他建議或回饋' },
  ];
  return `
    <section class="section">
      <div class="section-head">
        <span class="tag">FEEDBACK</span>
        <h2>開放式回饋</h2>
      </div>
      ${fields.map(f => {
        const raw = rows.map(r => r[f.key]).filter(v => v !== undefined && v !== null && String(v).trim());
        const responses = raw.filter(v => isMeaningfulFeedback(v));
        const skipped = raw.length - responses.length;
        return `
          <div class="feedback-block">
            <h3>${escapeHtml(f.label)} <span class="count">${responses.length} 則有效回應${skipped > 0 ? `（過濾 ${skipped} 則空白/無意義填答）` : ''}</span></h3>
            ${responses.length === 0
              ? `<div class="feedback-empty">（尚無回應）</div>`
              : `<div class="feedback-list">${responses.map(t => `<div class="feedback-item">${escapeHtml(String(t))}</div>`).join('')}</div>`
            }
          </div>`;
      }).join('')}
    </section>`;
}

/* ════════════════════════════════════════════════════════════════
   10. Helpers
   ════════════════════════════════════════════════════════════════ */
function avg(nums) {
  if (!nums.length) return 0;
  return nums.reduce((a, b) => a + b, 0) / nums.length;
}
function countBy(arr) {
  return arr.reduce((acc, v) => { acc[v] = (acc[v] || 0) + 1; return acc; }, {});
}
function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// 判斷是否為有意義的回饋（過濾掉「無」、「…」、「nil」、純標點等）
function isMeaningfulFeedback(v) {
  const s = String(v ?? '').trim();
  if (!s) return false;
  // 常見的「無回饋」字串（不分大小寫）
  if (/^(無|沒有|沒|沒什麼|皆無|nothing|nil|null|n\/a|na|none|no|x)$/i.test(s)) return false;
  // 純標點或符號（沒有任何實質內容）
  if (/^[\.。…—\-_~\/\\，,、;；:：!！?？\s]+$/.test(s)) return false;
  // 單一中英文字符也視為無意義（例如只填「.」「-」「x」）
  if (s.length < 2 && !/[一-鿿\w]{2,}/.test(s)) return false;
  return true;
}

   初始載入

loadData();

/* ════════════════════════════════════════════════════════════════
   14. 列印 / 匯出 PDF
   ------------------------------------------------------------------
   Chart.js 的 <canvas> 在列印時會因為容器尺寸改變而失真，
   因此列印前先把每張圖轉成 PNG <img>，列印結束後再移除。
   「分群深入分析」與「開放式回饋」以 .no-print 排除，不會列印出來。
   ════════════════════════════════════════════════════════════════ */
function preparePrintCharts() {
  cleanupPrintCharts();
  currentCharts.forEach(chart => {
    try {
      const canvas = chart.canvas;
      if (!canvas || !canvas.parentNode) return;
      if (canvas.closest('.no-print')) return;   // 不列印的區塊跳過
      const img = document.createElement('img');
      img.className = 'chart-print-img';
      img.src = chart.toBase64Image('image/png', 1);
      canvas.parentNode.insertBefore(img, canvas);
    } catch (e) {
      console.warn('圖表轉檔失敗：', e);
    }
  });
}

function cleanupPrintCharts() {
  document.querySelectorAll('.chart-print-img').forEach(img => img.remove());
}

window.addEventListener('beforeprint', preparePrintCharts);
window.addEventListener('afterprint', cleanupPrintCharts);

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('print-btn');
  if (btn) {
    btn.addEventListener('click', () => {
      preparePrintCharts();          // Safari 不支援 beforeprint，先手動處理
      setTimeout(() => window.print(), 120);
    });
  }
});

</script>
